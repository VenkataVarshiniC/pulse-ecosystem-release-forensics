[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulse-ecosystem-release-forensics"
version = "0.1.0"
description = "Post-release intelligence for reconstructing open-source ecosystem change."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "packaging>=24,<27",
  "psycopg[binary]==3.3.6",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6,<7",
]

[project.scripts]
pulse = "pulse.cli:main"

[dependency-groups]
analytics = [
    "dbt-core==1.11.15",
    "dbt-postgres==1.11.0",
]
dev = [
  "pytest>=8.2,<10",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
